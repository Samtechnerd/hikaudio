<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HikAudio</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1c1c1c; --card:#f2f3f5; --accent:#0a84d6; --bad:#d64545; --ok:#2e9e5b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --card:#1e1f22; } }
  body { margin:0; font:15px system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0 0 12px; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .tabs button { padding:8px 14px; border-radius:18px; border:1px solid var(--card); background:var(--card); color:var(--fg); cursor:pointer; }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .video { background:#000; border-radius:12px; overflow:hidden; aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; }
  .video img { width:100%; height:100%; object-fit:contain; display:block; }
  .video span { color:#aaa; }
  .row { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  button.act { flex:1; min-width:140px; padding:14px; font-size:16px; border:0; border-radius:12px; cursor:pointer; background:var(--card); color:var(--fg); }
  button.act.primary { background:var(--accent); color:#fff; }
  button.act.talking { background:var(--bad); color:#fff; }
  button.act:disabled { opacity:.45; cursor:default; }
  #status { margin-top:12px; padding:10px 12px; border-radius:10px; background:var(--card); min-height:1.2em; }
  #status.err { color:var(--bad); }
  #status.ok { color:var(--ok); }
  small { opacity:.7; display:block; margin-top:14px; }
</style>
</head>
<body>
<main>
  <h1>HikAudio</h1>
  <div class="tabs" id="tabs"></div>
  <div class="video"><img id="video" alt=""><span id="novideo">Starting video...</span></div>
  <div class="row">
    <button class="act primary" id="connect">Connect voice</button>
    <button class="act" id="talk" disabled>Hold to talk</button>
    <button class="act" id="mute" disabled>Mute door sound</button>
  </div>
  <div id="status">Pick a door station.</div>
  <small>Video comes straight from the door station. Voice needs microphone permission. Door sound is silenced while you talk, so it cannot feed back.</small>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
const api = (p, o) => fetch(p, o);   // relative on purpose: the panel runs under a Home Assistant ingress path
let device = null, live = false, talking = false, muted = false;
let actx = null, micStream = null, proc = null, listenAbort = null, nextT = 0, sendChain = Promise.resolve();

function setStatus(t, cls) { const s = $("status"); s.textContent = t; s.className = cls || ""; }
const q = d => "?device=" + encodeURIComponent(d);

async function init() {
  const r = await api("devices").catch(() => null);
  let names = [];
  if (r && r.ok) names = (await r.json()).devices || [];
  if (!names.length) { setStatus("No door stations found. Check the add-on options.", "err"); return; }
  const tabs = $("tabs");
  names.forEach(n => {
    const b = document.createElement("button");
    b.textContent = n.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
    b.onclick = () => pick(n);
    b.dataset.n = n;
    tabs.appendChild(b);
  });
  pick(names[0]);
}

async function pick(n) {
  if (live) await disconnect();
  device = n;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.n === n));
  const img = $("video");
  $("novideo").style.display = "";
  img.onload = () => { $("novideo").style.display = "none"; };
  img.onerror = () => { $("novideo").textContent = "No video from this door station."; $("novideo").style.display = ""; };
  img.src = "video" + q(n) + "&t=" + Date.now();
  setStatus("Ready. Press Connect voice to talk and listen.");
}

// --- G.711 u-law ---
function lin2ulaw(s) {
  const BIAS = 0x84, CLIP = 32635;
  const sign = (s >> 8) & 0x80;
  if (sign) s = -s;
  if (s > CLIP) s = CLIP;
  s += BIAS;
  let exp = 7;
  for (let m = 0x4000; (s & m) === 0 && exp > 0; m >>= 1) exp--;
  const mant = (s >> (exp + 3)) & 0x0F;
  return (~(sign | (exp << 4) | mant)) & 0xFF;
}
function ulaw2lin(u) {
  u = ~u & 0xFF;
  const sign = u & 0x80, exp = (u >> 4) & 7, mant = u & 15;
  let s = ((mant << 3) + 0x84) << exp;
  s -= 0x84;
  return sign ? -s : s;
}

function playDoor(bytes) {
  if (muted || talking || !actx || !bytes.length) return;
  const f = new Float32Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) f[i] = ulaw2lin(bytes[i]) / 32768;
  const b = actx.createBuffer(1, f.length, 8000);
  b.copyToChannel(f, 0);
  const src = actx.createBufferSource();
  src.buffer = b;
  src.connect(actx.destination);
  const now = actx.currentTime;
  if (nextT < now + 0.03) nextT = now + 0.15;   // small jitter buffer
  src.start(nextT);
  nextT += b.duration;
}

async function listenLoop() {
  listenAbort = new AbortController();
  try {
    const r = await api("live/listen" + q(device), { signal: listenAbort.signal });
    if (!r.ok) return;
    const rd = r.body.getReader();
    for (;;) {
      const { done, value } = await rd.read();
      if (done) break;
      playDoor(value);
    }
  } catch (e) { /* aborted or session ended */ }
  if (live) { await disconnect(); setStatus("Voice session ended.", ""); }
}

function startMic() {
  const src = actx.createMediaStreamSource(micStream);
  proc = actx.createScriptProcessor(4096, 1, 1);
  const ratio = actx.sampleRate / 8000;
  let phase = 0, acc = 0, cnt = 0, out = [];
  proc.onaudioprocess = e => {
    if (!talking) return;
    const x = e.inputBuffer.getChannelData(0);
    for (let i = 0; i < x.length; i++) {
      acc += x[i]; cnt++; phase += 1;
      if (phase >= ratio) {
        phase -= ratio;
        const v = Math.max(-1, Math.min(1, acc / cnt));
        out.push(lin2ulaw(Math.round(v * 32767)));
        acc = 0; cnt = 0;
      }
    }
    if (out.length >= 800) { sendAudio(new Uint8Array(out)); out = []; }
  };
  src.connect(proc);
  proc.connect(actx.destination);   // needed for the node to run; its output is silent
}

function sendAudio(buf) {
  const dev = device;
  sendChain = sendChain.then(() => api("live/audio" + q(dev), { method: "POST", body: buf }).catch(() => {}));
}

async function connect() {
  $("connect").disabled = true;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    await actx.resume();
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    $("connect").disabled = false;
    setStatus("No microphone access (" + e.name + "). Allow the microphone for this page, then try again. Listening still needs it granted.", "err");
    return;
  }
  setStatus("Connecting to the door station...");
  const r = await api("live/start" + q(device), { method: "POST" }).then(x => x.json()).catch(() => ({ ok: false, error: "no answer from the add-on" }));
  if (!r.ok) {
    cleanupAudio();
    $("connect").disabled = false;
    setStatus("Could not connect: " + (r.error || "unknown error"), "err");
    return;
  }
  live = true;
  startMic();
  $("connect").textContent = "Disconnect";
  $("connect").disabled = false;
  $("talk").disabled = false;
  $("mute").disabled = false;
  setStatus("Connected. Hold the talk button to speak. Sessions end after 5 minutes.", "ok");
  listenLoop();
}

function cleanupAudio() {
  if (proc) { try { proc.disconnect(); } catch (e) {} proc = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (actx) { actx.close().catch(() => {}); actx = null; }
  nextT = 0;
}

async function disconnect() {
  const dev = device;
  live = false; talking = false;
  if (listenAbort) listenAbort.abort();
  cleanupAudio();
  await api("live/stop" + q(dev), { method: "POST" }).catch(() => {});
  $("connect").textContent = "Connect voice";
  $("connect").disabled = false;
  $("talk").disabled = true; $("talk").classList.remove("talking"); $("talk").textContent = "Hold to talk";
  $("mute").disabled = true;
}

function talk(on) {
  if (!live) return;
  talking = on;
  $("talk").classList.toggle("talking", on);
  $("talk").textContent = on ? "Talking..." : "Hold to talk";
}

$("connect").onclick = () => (live ? disconnect().then(() => setStatus("Disconnected.")) : connect());
const tb = $("talk");
tb.addEventListener("pointerdown", e => { e.preventDefault(); tb.setPointerCapture(e.pointerId); talk(true); });
["pointerup", "pointercancel", "lostpointercapture"].forEach(ev => tb.addEventListener(ev, () => talk(false)));
$("mute").onclick = () => { muted = !muted; $("mute").textContent = muted ? "Unmute door sound" : "Mute door sound"; };
window.addEventListener("pagehide", () => { if (live && device) navigator.sendBeacon("live/stop" + q(device)); });
init();
</script>
</body>
</html>
